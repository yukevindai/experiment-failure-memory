[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "experiment-failure-memory"
version = "0.1.0"
description = "Private, searchable and traceable experimental failure knowledge"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3", "pint>=0.24"]

[project.optional-dependencies]
integration = ["reportlab>=4"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
failure-memory = "failure_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
failure_memory = ["static/*", "schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
